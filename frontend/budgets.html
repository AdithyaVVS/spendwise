<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Budgets</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="card month-bar">
      <button id="month-prev" type="button" class="secondary small" aria-label="Previous month">&larr; Prev</button>
      <h1 id="month-label"></h1>
      <button id="month-next" type="button" class="secondary small" aria-label="Next month">Next &rarr;</button>
      <input id="month-input" type="month" min="2000-01" max="2099-12" aria-label="Choose a month">
    </div>

    <div class="card">
      <h2 id="form-title">Set a budget</h2>
      <form id="budget-form">
        <div class="form-grid">
          <div>
            <label for="budget-category">Applies to</label>
            <select id="budget-category"></select>
          </div>
          <div>
            <label for="budget-amount">Monthly limit (INR)</label>
            <input id="budget-amount" type="text" inputmode="decimal" placeholder="5000" required autocomplete="off">
          </div>
          <div>
            <button type="submit" id="budget-submit">Save budget</button>
          </div>
        </div>
      </form>
      <p class="muted">Saving again for the same category and month replaces the old limit.</p>
      <div id="form-message" class="message" hidden></div>
    </div>

    <div class="card">
      <h2 id="list-title">Budgets</h2>
      <div id="list-message" class="message" hidden></div>
      <p id="empty" class="muted" hidden>No budgets set for this month yet.</p>
      <div class="table-wrap">
        <table id="budget-table" hidden>
          <thead>
            <tr>
              <th>Category</th>
              <th class="amount">Limit</th>
              <th class="amount">Spent</th>
              <th class="amount">Remaining</th>
              <th class="amount">Used</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="budget-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/budgets.js"></script>
</body>
</html>
